# AGI MC Bot Bridge 配置
# 由 Mod 首次启动时生成

# HTTP 服务监听地址（仅本机，安全考虑）
bind.address=127.0.0.1
bind.port=25580

# 鉴权 Token（首次启动自动生成，请勿泄露）
auth.token=

# 是否启用 Bot 功能
enabled=true

# Bot 无操作自动进入观察模式的秒数
idle.timeout=300

# 审计日志
audit.enabled=true
audit.file=logs/agi-audit.log

# 速率限制（单 IP 每秒请求数）
rate.limit=60
